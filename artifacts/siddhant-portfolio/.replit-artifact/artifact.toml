kind = "web"
previewPath = "/"
title = "Siddhant Shambharkar — Portfolio"
description = "A warm, editorial personal portfolio for Siddhant Shambharkar, a backend-focused software engineer whose work sits alongside research, writing, travel, music, and curious observations."
version = "1.0.0"
id = "artifacts/siddhant-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20456

[services.development]
run = "pnpm --filter @workspace/siddhant-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/siddhant-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/siddhant-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20456"
BASE_PATH = "/"
